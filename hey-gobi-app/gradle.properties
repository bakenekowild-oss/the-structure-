# Heap: 2 GB is enough for this app and fits a 7 GB GitHub Actions
# runner comfortably. (The local VM's Gradle daemon cannot run at all
# in this environment — see README — so the canonical build is Actions.)
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# The Android SDK location is set in local.properties (never committed).
# The NDK version is pinned in app/build.gradle.kts (27.2.12479018).
